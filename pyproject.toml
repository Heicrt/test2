[project]
name = "test2"
version = "0.1.0"
description = "ReAct Agent with LangGraph - Think → Act → Observe 循环演示"
readme = "README.md"
authors = [
    { name = "Heicrt", email = "Heicrt@HEICRT123" }
]
requires-python = ">=3.10"
dependencies = [ 
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.4",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    ]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
