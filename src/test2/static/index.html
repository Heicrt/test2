<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReAct Agent 可视化</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #2d3436;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2d3436;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .status { font-size: 13px; opacity: .8; }

    main {
      flex: 1;
      overflow-y: auto;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    .user {
      align-self: flex-end;
      background: #0984e3;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e1e4e8;
      border-bottom-left-radius: 2px;
    }

    /* 节点卡片 */
    .card {
      align-self: flex-start;
      width: 100%;
      border-left: 4px solid;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin: 2px 0;
      animation: fadeIn .2s ease;
    }
    .card .tag { font-weight: 700; margin-right: 8px; }
    .card.think  { background: #fff8e1; border-color: #f39c12; }
    .card.act    { background: #ffebee; border-color: #e74c3c; }
    .card.observe{ background: #e8f5e9; border-color: #27ae60; }
    .card .detail { color: #636e72; margin-top: 4px; padding-left: 4px; }
    .card .tool {
      display: inline-block; background: #fff; border-radius: 4px;
      padding: 1px 6px; font-family: monospace; font-size: 12px; margin: 2px 2px 0 0;
    }

    /* 节点状态指示器 */
    .indicator {
      align-self: center;
      display: flex;
      gap: 10px;
      padding: 6px 0;
    }
    .indicator span {
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 12px;
      background: #e1e4e8;
      color: #7f8c8d;
      transition: all .2s;
    }
    .indicator span.active.think   { background: #f39c12; color: #fff; }
    .indicator span.active.act     { background: #e74c3c; color: #fff; }
    .indicator span.active.observe { background: #27ae60; color: #fff; }

    .meta { align-self: center; font-size: 11px; color: #b2bec3; }

    /* 输入栏 */
    footer {
      border-top: 1px solid #e1e4e8;
      background: #fff;
      padding: 14px 24px;
    }
    #input-bar {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    #msg-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      outline: none;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: #0984e3; }
    button {
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #0984e3;
      color: #fff;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #0873c4; }
    button:disabled { background: #b2bec3; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>🤖 ReAct Agent 可视化</h1>
    <span class="status" id="status">就绪</span>
  </header>

  <main id="messages">
    <div class="card think"><span class="tag">💡 提示</span>输入一个问题，观察 Think → Act → Observe 循环如何工作。试试「1+2*3 等于多少？」或「北京天气怎么样？」</div>
  </main>

  <footer>
    <div id="input-bar">
      <input id="msg-input" placeholder="输入问题，回车发送…" autofocus>
      <button id="clear-btn">清空</button>
      <button id="send-btn">发送</button>
    </div>
  </footer>

  <script>
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");
    const statusEl = document.getElementById("status");

    let running = false;
    let assistantEl = null;

    function getSessionId() {
      let id = localStorage.getItem("test2_session_id");
      if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) ||
          "session-" + Date.now() + "-" + Math.random().toString(36).slice(2);
        localStorage.setItem("test2_session_id", id);
      }
      return id;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function append(el) {
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function bubble(text, cls) {
      const div = document.createElement("div");
      div.className = "bubble " + cls;
      div.textContent = text;
      append(div);
    }

    function indicator() {
      const div = document.createElement("div");
      div.className = "indicator";
      div.innerHTML = '<span class="think">Think</span><span class="act">Act</span><span class="observe">Observe</span>';
      append(div);
      return div.querySelectorAll("span");
    }

    // 根据 node 事件渲染卡片
    function renderNode(data, beforeEl) {
      const label = { think: "🤔 Think", act: "⚡ Act", observe: "👁️ Observe" }[data.node] || data.node;
      const div = document.createElement("div");
      div.className = "card " + (data.node || "think");
      let html = `<span class="tag">${label}</span>`;

      // think：显示思考内容 + 计划调用
      if (data.node === "think") {
        const thought = data.thought || "(AI 请求调用工具)";
        html += escapeHtml(thought);
        const tcs = data.tool_calls || [];
        if (tcs.length) {
          html += `<div class="detail">计划调用：`;
          tcs.forEach(tc => {
            html += `<span class="tool">${escapeHtml(tc.name)}(${escapeHtml(JSON.stringify(tc.args))})</span>`;
          });
          html += `</div>`;
        }
      }
      // act：显示工具调用
      else if (data.node === "act") {
        const actMsgs = (data.messages || []).filter(m => m.tool_calls);
        actMsgs.forEach(m => {
          (m.tool_calls || []).forEach(tc => {
            html += `<span class="tool">${escapeHtml(tc.name)}(${escapeHtml(JSON.stringify(tc.args))})</span>`;
          });
        });
        if (!actMsgs.length) html += "(执行中…)";
      }
      // observe：显示工具返回
      else if (data.node === "observe") {
        const obs = (data.messages || []).filter(m => m.type === "ToolMessage");
        obs.forEach(m => { html += `<div class="detail">↳ ${escapeHtml(m.content.slice(0, 200))}</div>`; });
        html += `<div class="detail">第 ${data.iteration} 轮</div>`;
      }
      div.innerHTML = html;
      if (beforeEl) {
        messagesEl.insertBefore(div, beforeEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else {
        append(div);
      }
    }

    async function send() {
      const message = input.value.trim();
      if (!message || running) return;
      input.value = "";
      bubble(message, "user");

      running = true;
      assistantEl = null;
      sendBtn.disabled = true;
      statusEl.textContent = "思考中…";
      const spans = indicator();
      let activeIdx = -1;

      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id: getSessionId() }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const blocks = buf.split("\n\n");
          buf = blocks.pop();
          for (const block of blocks) {
            let event = "message", dataRaw = "";
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) event = line.slice(6).trim();
              else if (line.startsWith("data:")) dataRaw += line.slice(5);
            }
            if (!dataRaw) continue;
            handleEvent(event, JSON.parse(dataRaw), spans, () => activeIdx);
          }
        }
      } catch (e) {
        bubble("❌ 连接错误：" + e.message, "assistant");
      } finally {
        running = false;
        sendBtn.disabled = false;
        statusEl.textContent = "就绪";
        spans.forEach(s => s.classList.remove("active"));
      }
    }

    async function clearSession() {
      if (running) return;
      try {
        await fetch("/api/clear", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: getSessionId() }),
        });
        messagesEl.innerHTML = "";
        statusEl.textContent = "已清空";
      } catch (e) {
        bubble("❌ 清空失败：" + e.message, "assistant");
      }
    }

    function handleEvent(event, data, spans, getActiveIdx) {
      if (event === "node") {
        const map = { think: 0, act: 1, observe: 2 };
        const idx = map[data.node];
        if (typeof idx === "number" && idx >= 0) {
          const cur = getActiveIdx();
          if (cur >= 0 && cur !== idx) spans[cur].classList.remove("active");
          spans[idx].classList.add("active");
        }
        renderNode(data, assistantEl);
      } else if (event === "token") {
        if (!assistantEl) {
          assistantEl = document.createElement("div");
          assistantEl.className = "bubble assistant";
          append(assistantEl);
        }
        assistantEl.textContent += data.content;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (event === "done") {
        statusEl.textContent = "就绪";
      } else if (event === "error") {
        const message = "❌ " + data.message;
        if (assistantEl) {
          assistantEl.textContent += "\n" + message;
        } else {
          bubble(message, "assistant");
        }
      }
    }

    sendBtn.onclick = send;
    clearBtn.onclick = clearSession;
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
